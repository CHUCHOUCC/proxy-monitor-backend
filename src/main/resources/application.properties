spring.application.name=proxy-monitor-backend

# Render injects PORT automatically
server.port=${PORT:8080}

# Comma separated list of allowed origins, e.g. https://my-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# 10% of PaymentService calls fail on purpose
app.payments.failure-rate=${PAYMENTS_FAILURE_RATE:0.10}

# Max number of logs kept in memory
app.logs.max-size=10000
